---
- name: "Check if VIOS logical partition already exists"
  connection: local
  ibm.power_hmc.vios:
    hmc_host: "{{ inventory_hostname }}"
    hmc_auth:
      username: "{{ ansible_user }}"
      password: "{{ ansible_password }}"
    system_name: "{{ vios_instance.system_name }}"
    name: "{{ vios_instance.name }}"
    state: "facts"
  register: vios_check

- name: "Run VIOS provisioning tasks"
  connection: local
  when: vios_check.vios_info is not defined
  block:
    - name: "Ensure VIOS logical partition is present"
      ibm.power_hmc.vios:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth:
          username: "{{ ansible_user }}"
          password: "{{ ansible_password }}"
        system_name: "{{ vios_instance.system_name }}"
        name: "{{ vios_instance.name }}"
        settings: "{{ vios_instance.settings }}"
        state: "present"

    - name: "Get MAC address of first network adapter found"
      ibm.power_hmc.hmc_command:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth:
          username: "{{ ansible_user }}"
          password: "{{ ansible_password }}"
        cmd: 'lpar_netboot -M -n -t ent "{{ vios_instance.name }}" "{{ vios_instance.settings.profile_name }}" "{{ vios_instance.system_name }}"'
      register: vios_hmc_command

    - name: "Ensure MAC address is set as fact"
      ansible.builtin.set_fact:
        vios_network_macaddr: >-
          {{ vios_hmc_command.command_output | regex_findall("ent\s+\S+\s+([0-9a-fA-F]{12})") | first }}

    - name: "Install VIOS logical partition using the image available on the HMC"
      ibm.power_hmc.vios:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth:
          username: "{{ ansible_user }}"
          password: "{{ ansible_password }}"
        system_name: "{{ vios_instance.system_name }}"
        name: "{{ vios_instance.name }}"
        prof_name: "{{ vios_instance.settings.profile_name }}"
        image_dir: "{{ vios_instance.image_dir }}"
        vios_iso: "{{ vios_instance.vios_iso }}"
        vios_IP: "{{ vios_instance.vios_ip }}"
        vios_gateway: "{{ vios_instance.vios_gateway }}"
        vios_subnetmask: "{{ vios_instance.vios_subnetmask }}"
        network_macaddr: "{{ vios_network_macaddr }}"
        action: install

    - name: "Ensure VIOS license is accepted"
      ibm.power_hmc.vios:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth:
          username: "{{ ansible_user }}"
          password: "{{ ansible_password }}"
        system_name: "{{ vios_instance.system_name }}"
        name: "{{ vios_instance.name }}"
        action: accept_license
